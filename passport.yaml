title: "Оцінювання обсягу та сортування відходів знесення за знімками БПЛА"
author: "Білан Д.С., група КНм-26"
version: 1

object:
  name: "Купи відходів будівництва і знесення (ВБЗ) на майданчику забудови"
  scale: "Окремий майданчик (1–3 га)"
  location: "Київ, район парку Перемога (дані OpenAerialMap)"

decision:
  user: "Підрядник з вивезення відходів / виконроб майданчика"
  period: "Щотижня або після завершення етапів демонтажу"
  cost_of_errors: "Пропуск купи відходів є більш критичним (вимагає Recall >= 0.90); похибка об'єму <= 20%"

task:
  type: "Семантична сегментація + регресія об'єму"
  classes: 
    - concrete_reinforced
    - brick_ceramics
    - wood
    - metal
    - drywall_sheets
    - mixed_waste
    - background

data:
  source: "Знімання БПЛА, RGB ортофотоплан (OpenAerialMap)"
  crs: "EPSG:32636 (WGS 84 / UTM zone 36N)"
  gsd_m: 0.0703
  required_gsd_m: 0.02
  min_object_m: 0.5
  format: "GeoTIFF (RGB)"
  license: "CC BY 4.0"

metrics:
  model:
    mIoU: ">= 0.70"
    recall: ">= 0.90"
    precision: ">= 0.85"
  indicator:
    volume_error: "<= 20%"

experiments_plan:
  lab_2: "Формування розміченої вибірки, завантаження даних, застосування аугментацій, побудова базової моделі U-Net"
  lab_3: "Порівняльний аналіз архітектур (U-Net, DeepLabV3+), підбір гіперпараметрів, оцінювання mIoU та Precision/Recall"
  lab_4: "Інтеграція результатів сегментації з цифровою моделлю поверхні (DSM), розрахунок об'ємів та обчислення показника R"

risks:
  - "Глибокі тіні від будівельної техніки та споруд, що спотворюють колір матеріалів"
  - "Неоднорідність і перекриття матеріалів всередині змішаних куп"
  - "Недостатня роздільна здатність (0.07 м/п) для розпізнавання дрібних фрагментів"
  - "Відсутність даних про насипну густину для точного перерахунку об'єму в масу"